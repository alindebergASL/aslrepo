<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Andrew Lindeberg — Practical AI notes for leaders, operators, and teams</title>
  <desc id="desc">Editorial preview image. Dark background with teal aurora glow, fine grid lines, and serif headline.</desc>
  <defs>
    <radialGradient id="aurora" cx="0.18" cy="0.12" r="0.8">
      <stop offset="0%" stop-color="#75e6c3" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#42c8a2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090a0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0c0e"/>
      <stop offset="50%" stop-color="#0e1214"/>
      <stop offset="100%" stop-color="#090a0c"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#75e6c3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#75e6c3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d5b46a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="markStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#75e6c3"/>
      <stop offset="100%" stop-color="#42c8a2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#aurora)"/>

  <g stroke="#f4efe7" stroke-opacity="0.05" fill="none">
    <rect x="80" y="80" width="1040" height="470" rx="10"/>
    <path d="M80 200 H1120 M80 460 H1120"/>
  </g>

  <g transform="translate(110, 130)">
    <circle cx="22" cy="22" r="22" fill="none" stroke="url(#markStroke)" stroke-width="1.4" opacity="0.7"/>
    <text x="22" y="30" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" fill="#75e6c3" letter-spacing="-0.5">AL</text>
    <text x="60" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#f4efe7" letter-spacing="0.5">Andrew Lindeberg</text>
  </g>

  <text x="110" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" font-style="italic" fill="#f4efe7" letter-spacing="-2">Practical AI notes</text>
  <text x="110" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" font-style="italic" fill="#f4efe7" letter-spacing="-2">for leaders, operators,</text>
  <text x="110" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" font-style="italic" fill="#f4efe7" letter-spacing="-2">and teams.</text>

  <rect x="110" y="487" width="120" height="1.5" fill="url(#hairline)"/>

  <text x="110" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" fill="#b7c0bb" letter-spacing="0.2">Agents · Adoption · Infrastructure · Security · Ecosystems</text>

  <text x="1090" y="565" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#75e6c3" letter-spacing="0.18em">ai-lab1.com</text>
